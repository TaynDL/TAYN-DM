name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: dotnet restore TaynDM.csproj

      # Portable (framework-dependent)
      - name: Publish portable
        run: dotnet publish TaynDM.csproj -c Release -r win-x64 --self-contained false -o ./publish-portable

      - name: Zip portable
        run: Compress-Archive -Path ./publish-portable/* -DestinationPath ./TaynDM-${{ github.ref_name }}-portable.zip

      # Create Release with only portable asset
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: TAYN DM ${{ github.ref_name }}
          generate_release_notes: false
          draft: false
          prerelease: false
          files: |
            ./TaynDM-${{ github.ref_name }}-portable.zip